<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #e94560;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .game-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      width: 100%;
      max-width: 900px;
    }

    /* Gallows */
    .gallows-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #16213e;
      border-radius: 12px;
      border: 2px solid #0f3460;
    }

    /* Right panel */
    .right-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      min-width: 280px;
    }

    #category {
      font-size: 0.85rem;
      color: #a0a0c0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Word display */
    .word-display {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .letter-box {
      width: 36px;
      height: 46px;
      border-bottom: 3px solid #e94560;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #f5f5f5;
      transition: color 0.3s;
    }

    /* Keyboard */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 320px;
    }

    .key {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .key:hover:not(:disabled) {
      background: #e94560;
      transform: scale(1.1);
    }

    .key:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .key.correct { background: #27ae60; opacity: 1; }
    .key.wrong   { background: #c0392b; opacity: 0.45; }

    /* Status & controls */
    #status {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e94560;
      min-height: 1.6rem;
      text-align: center;
    }

    #wrong-count {
      font-size: 0.9rem;
      color: #a0a0c0;
    }

    #new-game-btn {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    #new-game-btn:hover {
      background: #c0392b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Hangman</h1>

  <div class="game-container">
    <div class="gallows-area">
      <canvas id="gallows" width="240" height="280"></canvas>
    </div>

    <div class="right-panel">
      <div id="category">Category: <span id="cat-label"></span></div>
      <div class="word-display" id="word-display"></div>
      <div id="wrong-count">Wrong guesses: <span id="wc">0</span> / 6</div>
      <div class="keyboard" id="keyboard"></div>
      <div id="status"></div>
      <button id="new-game-btn">New Game</button>
    </div>
  </div>

  <script>
    const WORDS = [
      { word: 'ELEPHANT',   category: 'Animals' },
      { word: 'GIRAFFE',    category: 'Animals' },
      { word: 'PENGUIN',    category: 'Animals' },
      { word: 'JAVASCRIPT', category: 'Technology' },
      { word: 'KEYBOARD',   category: 'Technology' },
      { word: 'MONITOR',    category: 'Technology' },
      { word: 'PYTHON',     category: 'Technology' },
      { word: 'OCEAN',      category: 'Nature' },
      { word: 'MOUNTAIN',   category: 'Nature' },
      { word: 'VOLCANO',    category: 'Nature' },
      { word: 'THUNDER',    category: 'Nature' },
      { word: 'UMBRELLA',   category: 'Objects' },
      { word: 'SUITCASE',   category: 'Objects' },
      { word: 'LANTERN',    category: 'Objects' },
      { word: 'COMPASS',    category: 'Objects' },
      { word: 'BUTTERFLY',  category: 'Animals' },
      { word: 'DOLPHIN',    category: 'Animals' },
      { word: 'SATELLITE',  category: 'Technology' },
      { word: 'ASTRONAUT',  category: 'Space' },
      { word: 'GALAXY',     category: 'Space' },
    ];

    const MAX_WRONG = 6;

    let word, guessed, wrong;

    const canvas  = document.getElementById('gallows');
    const ctx     = canvas.getContext('2d');
    const wordEl  = document.getElementById('word-display');
    const kbEl    = document.getElementById('keyboard');
    const statusEl= document.getElementById('status');
    const wcEl    = document.getElementById('wc');
    const catEl   = document.getElementById('cat-label');

    // ── Drawing helpers ──────────────────────────────────────────
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawGallows() {
      ctx.strokeStyle = '#a0a0c0';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      // Base
      ctx.beginPath();
      ctx.moveTo(20, 260); ctx.lineTo(220, 260); ctx.stroke();
      // Pole
      ctx.beginPath();
      ctx.moveTo(60, 260); ctx.lineTo(60, 20); ctx.stroke();
      // Top bar
      ctx.beginPath();
      ctx.moveTo(60, 20); ctx.lineTo(160, 20); ctx.stroke();
      // Rope
      ctx.beginPath();
      ctx.moveTo(160, 20); ctx.lineTo(160, 50); ctx.stroke();
    }

    function drawPart(n) {
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      const cx = 160, headTop = 50, headR = 22;

      switch (n) {
        case 1: // head
          ctx.beginPath();
          ctx.arc(cx, headTop + headR, headR, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case 2: // body
          ctx.beginPath();
          ctx.moveTo(cx, headTop + headR * 2);
          ctx.lineTo(cx, headTop + headR * 2 + 70);
          ctx.stroke();
          break;
        case 3: // left arm
          ctx.beginPath();
          ctx.moveTo(cx, headTop + headR * 2 + 15);
          ctx.lineTo(cx - 35, headTop + headR * 2 + 45);
          ctx.stroke();
          break;
        case 4: // right arm
          ctx.beginPath();
          ctx.moveTo(cx, headTop + headR * 2 + 15);
          ctx.lineTo(cx + 35, headTop + headR * 2 + 45);
          ctx.stroke();
          break;
        case 5: // left leg
          ctx.beginPath();
          ctx.moveTo(cx, headTop + headR * 2 + 70);
          ctx.lineTo(cx - 35, headTop + headR * 2 + 110);
          ctx.stroke();
          break;
        case 6: // right leg
          ctx.beginPath();
          ctx.moveTo(cx, headTop + headR * 2 + 70);
          ctx.lineTo(cx + 35, headTop + headR * 2 + 110);
          ctx.stroke();
          break;
      }
    }

    function redrawFigure() {
      clearCanvas();
      drawGallows();
      for (let i = 1; i <= wrong; i++) drawPart(i);
    }

    // ── Game logic ───────────────────────────────────────────────
    function newGame() {
      const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
      word    = entry.word;
      guessed = new Set();
      wrong   = 0;

      catEl.textContent = entry.category;
      statusEl.textContent = '';
      wcEl.textContent = '0';

      redrawFigure();
      renderWord();
      renderKeyboard();
    }

    function renderWord() {
      wordEl.innerHTML = word.split('').map(ch =>
        `<div class="letter-box">${guessed.has(ch) ? ch : ''}</div>`
      ).join('');
    }

    function renderKeyboard() {
      kbEl.innerHTML = '';
      for (let c = 65; c <= 90; c++) {
        const letter = String.fromCharCode(c);
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.textContent = letter;
        btn.disabled = guessed.has(letter);
        if (guessed.has(letter)) {
          btn.classList.add(word.includes(letter) ? 'correct' : 'wrong');
        }
        btn.addEventListener('click', () => guess(letter));
        kbEl.appendChild(btn);
      }
    }

    function guess(letter) {
      if (guessed.has(letter)) return;
      guessed.add(letter);

      if (!word.includes(letter)) {
        wrong++;
        wcEl.textContent = wrong;
        drawPart(wrong);
      }

      renderWord();
      renderKeyboard();
      checkEndGame();
    }

    function checkEndGame() {
      const won = word.split('').every(ch => guessed.has(ch));
      if (won) {
        statusEl.textContent = 'You won!';
        statusEl.style.color = '#27ae60';
        disableKeyboard();
      } else if (wrong >= MAX_WRONG) {
        statusEl.textContent = `Game over! The word was: ${word}`;
        statusEl.style.color = '#e94560';
        // Reveal the word
        wordEl.innerHTML = word.split('').map(ch =>
          `<div class="letter-box" style="color:${guessed.has(ch)?'#f5f5f5':'#e94560'}">${ch}</div>`
        ).join('');
        disableKeyboard();
      }
    }

    function disableKeyboard() {
      kbEl.querySelectorAll('.key').forEach(b => b.disabled = true);
    }

    // ── Keyboard input ───────────────────────────────────────────
    document.addEventListener('keydown', e => {
      const letter = e.key.toUpperCase();
      if (/^[A-Z]$/.test(letter) && !guessed.has(letter)) guess(letter);
    });

    document.getElementById('new-game-btn').addEventListener('click', newGame);

    // Start!
    newGame();
  </script>
</body>
</html>
